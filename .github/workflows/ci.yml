# Fails a pull request before it reaches main. Deployment is Cloudflare Pages'
# Git integration, not this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci, not install: it is what Cloudflare runs, and it has caught a
      # peer-dependency conflict that passed locally on a newer npm.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build output keeps the CSP and routing guarantees
        run: |
          test -f dist/404.html
          test -f dist/_redirects
          grep -q "Disallow: /" dist/robots.txt
          grep -q "X-Robots-Tag: noindex" dist/_headers
          # No inline <script> bodies: script-src 'self' would block them.
          ! grep -E '<script[^>]*>[^<]' dist/index.html

  # A real browser against the real stack: this repo's production build, the
  # API from PaceStreak/api's main branch, Postgres and Redis. Turnstile uses
  # Cloudflare's always-pass test keys; email is printed to the API log,
  # which the tests read verification codes from.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pacestreak
          POSTGRES_PASSWORD: pacestreak
          POSTGRES_DB: pacestreak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pacestreak -d pacestreak"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pacestreak:pacestreak@localhost:5432/pacestreak
      REDIS_URL: redis://localhost:6379/0
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      EMAIL_BACKEND: console
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:8000
      RATE_LIMIT_SIGNUP: 100/minute
      RATE_LIMIT_LOGIN: 100/minute
      E2E_API_LOG: ${{ github.workspace }}/api.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: PaceStreak/api
          path: api-src
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Start the API
        working-directory: api-src
        run: |
          uv sync --locked
          make keys vapid
          uv run alembic upgrade head
          # The venv directly, not `uv run`: a long-lived uv process holds the
          # cache lock and fails setup-uv's clean-up step.
          nohup .venv/bin/uvicorn app.main:app --port 8000 > "$E2E_API_LOG" 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8000/health && break; sleep 1; done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the report and API log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            api.log
          retention-days: 7
