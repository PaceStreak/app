# Fails a pull request before it reaches main. Deployment is Cloudflare Pages'
# Git integration, not this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci, not install: it is what Cloudflare runs, and it has caught a
      # peer-dependency conflict that passed locally on a newer npm.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build output keeps the CSP and routing guarantees
        run: |
          test -f dist/404.html
          test -f dist/_redirects
          grep -q "Disallow: /" dist/robots.txt
          grep -q "X-Robots-Tag: noindex" dist/_headers
          # No inline <script> bodies: script-src 'self' would block them.
          ! grep -E '<script[^>]*>[^<]' dist/index.html

  # A real browser against the real stack: this repo's production build and
  # the Workers API from PaceStreak/api under `wrangler dev`, with local D1,
  # Queues and R2. Turnstile uses Cloudflare's always-pass test keys; email is
  # printed to the API log, which the tests read verification codes from.
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_API_LOG: ${{ github.workspace }}/api.log
      E2E_API_ORIGIN: http://localhost:8787
      E2E_API: http://localhost:8787/v1
    steps:
      - uses: actions/checkout@v5
      # `next` until the cutover merges it into main; then drop the ref.
      - uses: actions/checkout@v5
        with:
          repository: PaceStreak/api
          ref: next
          path: api-src
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: api-src/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Start the API
        working-directory: api-src
        run: |
          pnpm install --frozen-lockfile
          key() { openssl rand -base64 32; }
          {
            echo ENVIRONMENT=development
            echo MAILER=console
            echo COOKIE_DOMAIN=
            echo CORS_ORIGINS=http://localhost:5173
            echo FRONTEND_URL=http://localhost:5173
            echo PUBLIC_API_URL=http://localhost:8787
            echo "JWT_KEYS={\"current\":\"k1\",\"keys\":{\"k1\":\"$(key)\"}}"
            echo "PEPPER=$(key)"
            echo "DATA_KEY=$(key)"
            echo TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
            echo IP_LIMITS_OFF=1
          } > .dev.vars
          pnpm wrangler d1 migrations apply pacestreak --local
          nohup pnpm wrangler dev --port 8787 --ip 127.0.0.1 > "$E2E_API_LOG" 2>&1 &
          for i in $(seq 90); do curl -sf localhost:8787/health && break; sleep 1; done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the report and API log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            api.log
          retention-days: 7
